<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>М3 Меблі — 3D-перегляд</title>
    <link rel="icon" type="image/png" href="/src/assets/logo-m3.png" />
    <!-- Telegram Web App SDK: у звичайному браузері просто не спрацьовує -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="header">
        <img class="logo" src="/src/assets/logo-m3.png" alt="М3 Меблі" />
        <span id="title">Завантаження…</span>
        <button id="kpbtn" class="kp-btn" type="button" title="Комерційна пропозиція" aria-label="Комерційна пропозиція" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8l4.5 4.5v12a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4.5M8.5 12h7M8.5 15h7M8.5 18h4"/></svg>
          <span>КП</span>
        </button>
        <button id="menu" class="icon-btn" type="button" title="Меню" aria-label="Меню" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button id="share" class="icon-btn" type="button" title="Поділитися" aria-label="Поділитися" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg>
        </button>
      </header>
      <div id="body">
        <main id="stage">
          <canvas id="canvas"></canvas>
          <div id="labels" hidden></div>
          <div id="viewcube"></div>
          <div id="toolbar" hidden></div>
          <div id="rulers"></div>
          <div id="loader">
            <div class="badge"><img src="/src/assets/logo-m3-full.png" alt="M3 Meble — створюємо комфорт" /></div>
            <div id="loader-name"></div>
            <div class="loader-bar"><span id="loader-fill"></span></div>
            <div id="loader-text">Завантаження моделі…</div>
          </div>
          <img class="watermark" src="/src/assets/logo-m3.png" alt="" />
          <div class="order-bar">
            <div id="valid" class="valid-chip" hidden></div>
            <button id="order" class="order-btn" type="button" hidden>Замовити</button>
            <button id="decline" class="decline-link" type="button" hidden>відмовитись</button>
          </div>
          <div id="toast" hidden></div>
          <div id="error" hidden></div>
        </main>
        <aside id="sidebar">
          <div id="info"></div>
          <div id="panel"></div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
